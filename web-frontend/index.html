<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <button id="newChat" class="new-chat-btn">+ Nova conversa</button>
      <div id="sessionList" class="session-list"></div>
      <a id="logoutBtn" class="logout-btn" href="https://auth.ia.diegofnunesbr.com/logout?rd=https://ia.diegofnunesbr.com/">Desconectar</a>
    </aside>
    <main class="chat">
      <button type="button" id="menuToggle" class="menu-toggle" aria-label="Conversas">☰</button>
      <div id="messagesScroll" class="messages-scroll">
        <div id="messages" class="messages">
          <div id="emptyState" class="empty-state">
            <p>Como posso ajudar hoje?</p>
          </div>
        </div>
      </div>
      <form id="form" class="composer">
        <div class="composer-inner">
          <button type="button" id="attach" class="icon-btn" title="Anexar arquivo" aria-label="Anexar arquivo">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input id="fileInput" type="file" accept="image/*,.pdf" hidden />
          <input id="input" type="text" placeholder="Escreva ou fale..." autocomplete="off" />
          <button type="button" id="mic" class="icon-btn" title="Falar" aria-label="Falar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button type="submit" id="sendBtn" class="send-btn" title="Enviar" aria-label="Enviar">
            <svg class="send-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            <svg class="stop-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          </button>
        </div>
      </form>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
