server {
  listen 80;

  # Matches the 20MB limit multer enforces in agent-backend's /upload -
  # nginx's own default (1MB) would otherwise reject larger files first.
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://agent-backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
