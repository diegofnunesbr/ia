apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ia
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 15Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ia
spec:
  replicas: 1
  # Default RollingUpdate tries to bring the new pod up before tearing
  # down the old one - with only one replica and requests this large
  # (10Gi RAM), the node doesn't have room for both at once and the
  # rollout gets stuck Pending forever ("Insufficient memory"), silently
  # leaving the old pod running. Recreate kills the old one first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.3.14
          ports:
            - containerPort: 11434
          env:
            # Single user, one request at a time - avoids spawning extra
            # parallel model contexts that would multiply RAM usage.
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            # Keep both models (chat + embeddings) resident so switching
            # between them on every message doesn't force a reload from
            # disk each time.
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            # -1 = never unload. VM has 16GB now, plenty of room to keep
            # the ~5-6GB model resident permanently and avoid the ~1min
            # reload-from-disk delay on the first message after idling.
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "1"
              # qwen2.5:7b-instruct needs ~5-6Gi loaded - VM has 12GB
              # total, plenty of room for this plus the other pods.
              memory: 6Gi
            limits:
              # VM is dedicated to this project (owner's call) and going
              # to 8 cores - lets prefill (processing large, never-cached
              # tool results) use the full VM, even though pure decode
              # won't benefit past ~6. A limit isn't a reservation, so
              # this doesn't starve the other pods' small CPU requests.
              cpu: "8"
              # VM has 12GB total now (down from 16GB) - 9Gi keeps ~3GB
              # of margin above the real ~7GB need (weights + KV cache
              # at num_ctx=16384) for the OS, kubelet, and other pods.
              memory: 9Gi
          readinessProbe:
            tcpSocket:
              port: 11434
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ia
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
