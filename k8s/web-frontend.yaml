apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: ia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: ia/web-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
          imagePullPolicy: IfNotPresent

          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:80/
            - --provider=oidc
            - --oidc-issuer-url=https://keycloak.diegofnunesbr.com/realms/home
            - --redirect-url=https://ia.diegofnunesbr.com/oauth2/callback
            - --scope=openid email profile
            - --email-domain=*
            - --allowed-group=ia-users
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --cookie-secure=true
            - --whitelist-domain=keycloak.diegofnunesbr.com

          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: ia

            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-backend-oidc
                  key: clientSecret

            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-backend-oidc
                  key: cookieSecret

          ports:
            - containerPort: 4180

---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: ia
spec:
  type: ClusterIP
  selector:
    app: web-frontend
  ports:
    - name: web
      port: 4180
      targetPort: 4180

    - name: direct
      port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-frontend
  namespace: ia
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-clusterissuer
    # Same reasoning as web-frontend/nginx.conf: CPU inference can take
    # well past the 60s default before agent-backend replies.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ia.diegofnunesbr.com
      secretName: ia-tls
  rules:
    - host: ia.diegofnunesbr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-frontend
                port:
                  number: 4180
