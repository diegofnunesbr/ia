apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: personal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: personal-ai/web-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: personal-ai
spec:
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-frontend
  namespace: personal-ai
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.personal-ai.svc.cluster.local/api/verify"
    # Hardcodes the ingress-nginx NodePort (443:<this>) since it's a
    # baremetal/NodePort install, not the standard 443 - check
    # `kubectl get svc -n ingress-nginx` and update this if it ever
    # changes (e.g. the Service gets recreated without a pinned nodePort).
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.home:30277/?rd=$scheme://$http_host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Groups,Remote-Name,Remote-Email"
    # Same reasoning as web-frontend/nginx.conf: CPU inference can take
    # well past the 60s default before agent-backend replies.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["ia.home"]
      secretName: personal-ai-tls
  rules:
    - host: ia.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-frontend
                port:
                  number: 80
