apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: ia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: ia/web-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
# Plain HTTP, exposed directly via NodePort - no ingress-nginx/TLS/domain
# needed. Login/2FA live in agent-backend itself (see auth.js).
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: ia
spec:
  type: NodePort
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30277
