apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: ia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: ia/web-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: ia
spec:
  selector:
    app: web-frontend
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-frontend
  namespace: ia
  annotations:
    # Login/2FA now live in agent-backend itself (see auth.js) - no more
    # Authelia auth-url/auth-signin subrequest here.
    # Same reasoning as web-frontend/nginx.conf: CPU inference can take
    # well past the 60s default before agent-backend replies.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - secretName: ia-tls
  rules:
    # No `host:` - matches any Host header, including plain IP access
    # (e.g. https://192.168.0.5:30277/), not just a specific domain.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-frontend
                port:
                  number: 80
