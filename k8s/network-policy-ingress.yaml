# Restricts which pods can call each internal service, so the login
# gate in agent-backend isn't the only thing standing between an
# already-on-the-network attacker and agent-backend/ollama/postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-backend-ingress
  namespace: ia
spec:
  podSelector:
    matchLabels:
      app: agent-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-frontend

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-ingress
  namespace: ia
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent-backend
        - podSelector:
            matchLabels:
              app: onenote-sync

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: ia
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent-backend
        - podSelector:
            matchLabels:
              app: onenote-sync

# No ingress NetworkPolicy for web-frontend: it's now exposed directly via
# NodePort (plain HTTP, no ingress-nginx in front), so it's meant to be
# reachable from the whole LAN - that's the actual entry point of the app.