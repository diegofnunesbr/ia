apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-backend-ingress
  namespace: ia
spec:
  podSelector:
    matchLabels:
      app: agent-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web-frontend

