apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-to-pdf
  namespace: personal-ai
  labels:
    app: image-to-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-to-pdf
  template:
    metadata:
      labels:
        app: image-to-pdf
    spec:
      containers:
        - name: image-to-pdf
          image: personal-ai/image-to-pdf:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: image-to-pdf
  namespace: personal-ai
spec:
  selector:
    app: image-to-pdf
  ports:
    - port: 8000
      targetPort: 8000
