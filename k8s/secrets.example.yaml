# Template only - do not apply as-is.
# Generate real random values, e.g.: openssl rand -hex 32
# Then follow the project's sealed-secrets pattern: printf '%s' '<value>' | kubeseal --scope cluster-wide ...
apiVersion: v1
kind: Secret
metadata:
  name: agent-backend-auth-secrets
  namespace: ia
type: Opaque
stringData:
  # Login gate built into agent-backend (auth.js) - replaces Authelia.
  # Just username/password for now (no 2FA yet). Generate the hash by
  # running this inside the agent-backend pod (already has bcryptjs):
  #   kubectl exec -n ia deploy/agent-backend -- node -e \
  #     "console.log(require('bcryptjs').hashSync('sua-senha', 10))"
  username: "REPLACE_ME"
  password-hash: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: ia
type: Opaque
stringData:
  password: "REPLACE_ME"

---
# IMPORTANT: unlike the secrets above, do NOT seal this one with kubeseal.
# The onenote-sync CronJob patches "refresh-token" on every run (Microsoft
# rotates it on each use) - if this were managed as a SealedSecret, the
# sealed-secrets controller would revert that patch back to the sealed
# value on its next reconcile, breaking the rotation. Apply this one
# directly with `kubectl apply -f` (or `kubectl create secret generic`),
# keep it out of git once filled in, and re-apply manually if you ever
# need to reset it.
apiVersion: v1
kind: Secret
metadata:
  name: onenote-sync-secrets
  namespace: ia
type: Opaque
stringData:
  # Application (client) ID do app registrado no Azure AD (ver README).
  client-id: "REPLACE_ME"
  # Saída do `node onenote-sync/auth.js` (login único e manual).
  refresh-token: "REPLACE_ME"
