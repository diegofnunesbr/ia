apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: ia
type: Opaque
stringData:
  password: "REPLACE_ME"

---
# JWT_SECRET / SESSION_SECRET / STORAGE_ENCRYPTION_KEY: random strings,
# e.g. `openssl rand -hex 32` for each.
apiVersion: v1
kind: Secret
metadata:
  name: authelia-secrets
  namespace: ia
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  SESSION_SECRET: "REPLACE_ME"
  STORAGE_ENCRYPTION_KEY: "REPLACE_ME"

---
# users_database.yml content, Authelia's file-based auth backend format.
# Generate the argon2 password hash with:
#   docker run --rm authelia/authelia:4.38 authelia crypto hash generate argon2 --password 'yourpassword'
apiVersion: v1
kind: Secret
metadata:
  name: authelia-users
  namespace: ia
type: Opaque
stringData:
  users_database.yml: |
    users:
      diego:
        displayname: "Diego"
        password: "REPLACE_ME_ARGON2_HASH"
        email: diego@diegofnunesbr.com
        groups:
          - admins
