apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: personal-ai
data:
  configuration.yml: |
    server:
      address: 'tcp://0.0.0.0:9091'

    log:
      level: info

    authentication_backend:
      file:
        path: /secrets/users_database.yml

    access_control:
      default_policy: deny
      rules:
        - domain: 'assistente.home.lan'
          policy: two_factor

    session:
      cookies:
        - domain: 'home.lan'
          # Must match the actual URL used in the browser, port included -
          # this bare-metal ingress-nginx setup is NodePort, not standard
          # 443. A mismatched port here makes Authelia treat the post-login
          # redirect target as unsafe, so it shows the plain "Autenticado"
          # page instead of auto-redirecting back to rd.
          authelia_url: 'https://auth.home.lan:30277'
          # Home LAN, single user - no need to re-auth constantly.
          # expiration/inactivity control the plain session; remember_me
          # is the separate, much longer "lembrar-me" checkbox on login.
          expiration: '12h'
          inactivity: '1h'
          remember_me: '30d'

    storage:
      local:
        path: /data/db.sqlite3

    notifier:
      filesystem:
        filename: /data/notification.txt

    totp:
      issuer: 'assistente.home.lan'
