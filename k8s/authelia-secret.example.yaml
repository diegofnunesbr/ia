# Template only - do not apply as-is.
# Generate real random values, e.g.: openssl rand -hex 32
# Then follow the project's sealed-secrets pattern: printf '%s' '<value>' | kubeseal --scope cluster-wide ...
apiVersion: v1
kind: Secret
metadata:
  name: authelia-secrets
  namespace: ia
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  SESSION_SECRET: "REPLACE_ME"
  STORAGE_ENCRYPTION_KEY: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: authelia-users
  namespace: ia
type: Opaque
stringData:
  # Generate the hash with:
  # docker run --rm authelia/authelia:4.38 authelia crypto hash generate argon2 --password 'sua-senha'
  users_database.yml: |
    users:
      owner:
        displayname: "Owner"
        password: "$argon2id$REPLACE_WITH_GENERATED_HASH"
        email: owner@home.lan
        groups:
          - admins

---
apiVersion: v1
kind: Secret
metadata:
  name: whatsapp-bridge-secrets
  namespace: ia
type: Opaque
stringData:
  # Seu número com DDI/DDD, sem espaços ou símbolos (ex.: 5511999999999).
  # Só mensagens desse número serão respondidas.
  allowed-number: "REPLACE_ME"
  # JID do grupo onde as imagens serão convertidas para PDF (ex.: 1203630xxxxxxxxx@g.us).
  # Descubra rodando o bridge e olhando os logs de mensagens recebidas do grupo.
  pdf-group-id: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: ia
type: Opaque
stringData:
  password: "REPLACE_ME"

---
# IMPORTANT: unlike the secrets above, do NOT seal this one with kubeseal.
# The onenote-sync CronJob patches "refresh-token" on every run (Microsoft
# rotates it on each use) - if this were managed as a SealedSecret, the
# sealed-secrets controller would revert that patch back to the sealed
# value on its next reconcile, breaking the rotation. Apply this one
# directly with `kubectl apply -f` (or `kubectl create secret generic`),
# keep it out of git once filled in, and re-apply manually if you ever
# need to reset it.
apiVersion: v1
kind: Secret
metadata:
  name: onenote-sync-secrets
  namespace: ia
type: Opaque
stringData:
  # Application (client) ID do app registrado no Azure AD (ver README).
  client-id: "REPLACE_ME"
  # Saída do `node onenote-sync/auth.js` (login único e manual).
  refresh-token: "REPLACE_ME"
