apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authelia-data
  namespace: personal-ai
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: personal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      # Kubernetes injects <SERVICE>_PORT/<SERVICE>_SERVICE_* env vars for
      # every Service in the namespace by default. Authelia treats any
      # AUTHELIA_* env var as a config override, so those auto-injected
      # vars (from the "authelia" Service itself) collide with real
      # config keys and crash it on startup. Turn that off.
      enableServiceLinks: false
      containers:
        - name: authelia
          image: authelia/authelia:4.38
          ports:
            - containerPort: 9091
          env:
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: JWT_SECRET
            - name: AUTHELIA_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: SESSION_SECRET
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: STORAGE_ENCRYPTION_KEY
          volumeMounts:
            - name: config
              mountPath: /config
            - name: users
              mountPath: /secrets
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 9091
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: users
          secret:
            secretName: authelia-users
        - name: data
          persistentVolumeClaim:
            claimName: authelia-data

---
apiVersion: v1
kind: Service
metadata:
  name: authelia
  namespace: personal-ai
spec:
  selector:
    app: authelia
  ports:
    - port: 80
      targetPort: 9091

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  namespace: personal-ai
  annotations:
    # Visiting the bare portal (no path, no query) is what happens when
    # you type auth.home.lan directly - send it straight to the app
    # instead of Authelia's own account page. Login/2FA/reset routes and
    # the ?rd=... redirect flow all have a path or query string, so they
    # never match this and are untouched.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri = "/") {
        return 302 https://assistente.home.lan:30277/;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["auth.home.lan"]
      secretName: personal-ai-tls
  rules:
    - host: auth.home.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  number: 80
