apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-backend-search-egress
  namespace: personal-ai
spec:
  # Narrow, additive exception on top of deny-external-egress: only HTTPS
  # (443) leaves this pod, and only for the web_search tool. Standard
  # NetworkPolicy can't allowlist by domain (only IP/port), so this is as
  # tight as it gets without a dedicated egress proxy - no other ports,
  # no plain HTTP, nothing else changes for agent-backend.
  podSelector:
    matchLabels:
      app: agent-backend
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
