apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend
  namespace: ia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-backend
  template:
    metadata:
      labels:
        app: agent-backend
    spec:
      containers:
        - name: agent-backend
          image: ia/agent-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: OWNER_NAME
              value: "Diego"
            - name: AI_NAME
              value: "IA" # nome que a IA usa para si mesma
            - name: AGENT_MODEL
              value: qwen2.5:3b-instruct
            - name: OLLAMA_URL
              value: http://ollama:11434
            - name: PUBLIC_BASE_URL
              value: /api
            - name: EMBED_MODEL
              value: nomic-embed-text
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: password
            - name: DATABASE_URL
              value: postgresql://assistant:$(POSTGRES_PASSWORD)@postgres:5432/assistant
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: agent-backend-auth-secrets
                  key: username
            - name: AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: agent-backend-auth-secrets
                  key: password-hash
            - name: TRUST_PROXY_HEADER
              value: X-Forwarded-Preferred-Username
            - name: PROXY_LOGOUT_URL
              value: "/oauth2/sign_out?rd=https%3A%2F%2Fkeycloak.diegofnunesbr.com%2Frealms%2Fhomelab%2Fprotocol%2Fopenid-connect%2Flogout%3Fid_token_hint%3D%7Bid_token%7D%26post_logout_redirect_uri%3Dhttps%3A%2F%2Fia.diegofnunesbr.com"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # OCR (tesseract.js) is the CPU-heavy path here - the limit
              # gives it room to burst without starving other pods.
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: agent-backend
  namespace: ia
spec:
  selector:
    app: agent-backend
  ports:
    - port: 3000
      targetPort: 3000
